# Local Git hooks for Voxclip. Install with `task hooks:install`; CI remains
# authoritative for the full test suite.
pre-commit:
  parallel: true
  commands:
    author-identity:
      run: task commit:check-author
    conflict-markers:
      run: task commit:check-conflicts -- {staged_files}
    gofmt:
      glob: "*.go"
      run: task commit:check-gofmt -- {staged_files}
    commit-policy-tests:
      glob: "{lefthook.yml,Taskfile.yml,scripts/check-attribution.sh,scripts/check-author.sh,scripts/check-author-test.sh,scripts/check-commit-msg.sh,scripts/check-commit-msg-test.sh,scripts/check-push-messages.sh,scripts/check-push-messages-test.sh}"
      run: task test:commit-policy

commit-msg:
  commands:
    message-policy:
      run: task commit:check-message -- {1}

pre-push:
  commands:
    message-policy:
      run: task commit:check-push
