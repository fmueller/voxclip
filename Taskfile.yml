version: "3"

tasks:
  whisper:build:
    desc: Build and stage whisper-cli for current host
    cmds:
      - ./scripts/build-whisper-cli.sh

  tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy

  build:
    desc: Build voxclip CLI
    cmds:
      - go build ./cmd/voxclip

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test:integration:
    desc: Run integration tests
    cmds:
      - go test -tags=integration ./...

  fmt:check:
    desc: Fail if any Go file needs formatting
    cmds:
      - |
        out="$(gofmt -l .)"
        if [ -n "$out" ]; then
          echo "The following files need gofmt:" >&2
          echo "$out" >&2
          exit 1
        fi

  vet:
    desc: Run Go static analysis
    cmds:
      - go vet ./...

  licenses:check:
    desc: Check dependency licenses
    cmds:
      - go-licenses check ./cmd/voxclip --allowed_licenses=Apache-2.0,MIT,BSD-3-Clause,ISC

  test:e2e:
    desc: Run end-to-end transcription tests
    cmds:
      - go test -tags=e2e ./internal/cli -count=1

  test:installer:
    desc: Run installer script bats tests
    cmds:
      - bats scripts/install-voxclip_test.bats

  test:commit-msg:
    desc: Test the commit-message policy
    cmds:
      - bash scripts/check-commit-msg-test.sh

  test:author:
    desc: Test the agent-identity author guard
    cmds:
      - bash scripts/check-author-test.sh

  test:push-messages:
    desc: Test the pre-push commit guard
    cmds:
      - bash scripts/check-push-messages-test.sh

  test:commit-policy:
    desc: Test all commit policy guards
    cmds:
      - task: test:commit-msg
      - task: test:author
      - task: test:push-messages

  test:mutate:
    desc: Run mutation testing with gremlins
    cmds:
      - gremlins unleash

  test:mutate:gate:
    desc: Run mutation testing with the CI efficacy gate
    cmds:
      - gremlins unleash --threshold-efficacy 0.25

  run:
    desc: Run voxclip with default flow
    cmds:
      - go run ./cmd/voxclip

  run:setup:
    desc: Run setup command
    cmds:
      - go run ./cmd/voxclip setup

  run:devices:
    desc: Run devices command
    cmds:
      - go run ./cmd/voxclip devices

  run:record:
    desc: Run record command
    cmds:
      - go run ./cmd/voxclip record

  run:transcribe:
    desc: Run transcribe command
    cmds:
      - go run ./cmd/voxclip transcribe

  release:check:
    desc: Validate goreleaser configuration
    cmds:
      - goreleaser check

  release:dry:
    desc: Build snapshot release artifacts for all targets
    cmds:
      - goreleaser release --snapshot --clean

  release:dry:host:
    desc: Build snapshot artifacts for current OS/arch only
    deps:
      - whisper:build
    cmds:
      - goreleaser build --snapshot --clean --single-target

  hooks:install:
    desc: Install opt-in Lefthook Git hooks
    cmds:
      - git config --local core.hooksPath .git/hooks
      - lefthook install --force
