name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Verify formatting
        run: task fmt:check

      - name: Vet
        run: task vet

      - name: Check commit policy guards
        run: task test:commit-policy

      - name: Check dependency licenses
        run: task licenses:check

      - name: CLI help smoke test
        run: task test:cli-help

      - name: Installer script syntax check
        run: task test:installer:syntax

      - name: Validate GoReleaser config
        run: task release:check

  unit-tests:
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Unit tests
        run: task test

  integration-tests:
    needs: unit-tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Integration-tag tests
        run: task test:integration

  e2e-tests:
    needs: integration-tests
    runs-on: ubuntu-latest
    env:
      WHISPER_REF: v1.8.3
      VOXCLIP_E2E_MODEL: tiny
      VOXCLIP_E2E_MODEL_DIR: ${{ github.workspace }}/.cache/voxclip-models
      VOXCLIP_E2E_WHISPER_PATH: ${{ github.workspace }}/packaging/whisper/linux_amd64/whisper-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Restore whisper-cli cache
        id: whisper-cache
        uses: actions/cache@v5
        with:
          path: packaging/whisper/linux_amd64
          key: whisper-${{ runner.os }}-${{ env.WHISPER_REF }}-${{ hashFiles('scripts/build-whisper-cli.sh') }}
          restore-keys: |
            whisper-${{ runner.os }}-${{ env.WHISPER_REF }}-

      - name: Build whisper-cli
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: task whisper:build

      - name: Restore model cache
        uses: actions/cache@v5
        with:
          path: ${{ env.VOXCLIP_E2E_MODEL_DIR }}
          key: voxclip-model-${{ runner.os }}-${{ env.VOXCLIP_E2E_MODEL }}-${{ hashFiles('internal/whisper/model.go') }}
          restore-keys: |
            voxclip-model-${{ runner.os }}-${{ env.VOXCLIP_E2E_MODEL }}-

      - name: Warm tiny model cache
        run: task e2e:model:warm

      - name: End-to-end transcription tests
        run: task test:e2e

  mutation-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Run mutation tests
        run: task test:mutate:gate

  installer-tests:
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Install bats
        run: task ci:install-bats

      - name: Run installer tests
        run: task test:installer
